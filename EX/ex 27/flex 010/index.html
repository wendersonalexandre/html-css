<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        .conteiner{
            background-color: lightcoral;
            border-radius: 5px;
            border: 1px solid black;
            display: flex;
            flex-flow: row wrap;
        }

        .item{
            background-color: aquamarine;
            border: 1px solid black;
            padding: 5px;
            margin: 5px;
            text-align: center;
            border-radius: 5px;
            flex-basis: 100px;
            flex-shrink: 1;
            flex-grow: 2;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
